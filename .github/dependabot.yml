# Dependabot configuration — https://docs.github.com/en/code-security/dependabot
version: 2

updates:
  # npm (production + dev dependencies)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "yaiba2307"
    labels:
      - "dependencies"
    # Group minor + patch bumps to reduce PR noise
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "yaiba2307"
    labels:
      - "dependencies"
      - "ci"
