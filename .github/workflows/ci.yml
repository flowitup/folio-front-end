# CI + CD for the Folio web front end.
#
# Pull requests to master:
#   version-bump → bumps package.json from the highest released tag and the PR labels
#                  (version:major | version:minor | version:patch, default patch;
#                  version:none opts out) and pushes the commit back to the PR branch.
#                  This keeps the manifest roughly right; it does not decide the release.
#
# Push to master (a squash-merged PR):
#   The whole suite runs again on the merge commit, then release. Re-running it is
#   not redundant: a pull request is tested against its own base, so a rule added by
#   one PR can be broken by another that merged in parallel and never ran it. That
#   happened — #297 added a settings-nav rule, #298 shipped a tab that broke it, and
#   master stayed red and shipping because `test` was skipped here and `release`
#   waited for nothing. Release now needs `build`, so a red master does not deploy.
#
#   release → computes the next version from the TAG LIST, tags the merge commit,
#             publishes a GitHub Release and dispatches the deploy to flowitup/folio.
#             Reading the version from package.json instead used to let two pull
#             requests open at once claim the same number: the second to merge hit an
#             existing tag and was silently skipped — no release, no deploy — while the
#             run stayed green. Only version:none opts out now.

name: CI Pipeline

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  statuses: write

jobs:
  # Job 1: Calculate and commit version bump (only on PR)
  version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      new_version: ${{ steps.compute-version.outputs.new_version }}
      version_bumped: ${{ steps.compute-version.outputs.version_bumped }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR labels
        id: get-labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "PR Number: $PR_NUMBER"

          # Get labels from event payload first (more reliable)
          EVENT_LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          echo "Labels from event: $EVENT_LABELS"

          # Fallback to gh CLI if event labels empty
          if [ "$EVENT_LABELS" = "[]" ] || [ -z "$EVENT_LABELS" ]; then
            LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>&1) || true
            echo "Labels from gh CLI: $LABELS"
          else
            LABELS="$EVENT_LABELS"
          fi

          # Explicit label wins; otherwise default to patch so every merged PR
          # produces a release. Use `version:none` to opt out (rare: docs-only,
          # ci-only, or hotfix that piggybacks on the previous release).
          if echo "$LABELS" | grep -q "version:major"; then
            echo "bump_type=major" >> $GITHUB_OUTPUT
            echo "Detected: major"
          elif echo "$LABELS" | grep -q "version:minor"; then
            echo "bump_type=minor" >> $GITHUB_OUTPUT
            echo "Detected: minor"
          elif echo "$LABELS" | grep -q "version:none"; then
            echo "bump_type=none" >> $GITHUB_OUTPUT
            echo "Detected: none (explicit opt-out)"
          else
            # Default — covers both `version:patch` and any PR with no label.
            echo "bump_type=patch" >> $GITHUB_OUTPUT
            echo "Detected: patch (default)"
          fi

      - name: Get main branch version
        id: main-version
        run: |
          # The highest released tag, matching what the release job will compute at
          # merge. Reading master's package.json instead let two open pull requests
          # claim the same number.
          MAIN_VERSION=$(git tag -l 'v[0-9]*' | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          MAIN_VERSION=${MAIN_VERSION:-0.0.0}
          echo "main_version=$MAIN_VERSION" >> $GITHUB_OUTPUT
          echo "Main branch version: $MAIN_VERSION"

      - name: Compute new version
        id: compute-version
        run: |
          BUMP_TYPE="${{ steps.get-labels.outputs.bump_type }}"
          MAIN_VERSION="${{ steps.main-version.outputs.main_version }}"

          # Get current PR version
          PR_VERSION=$(grep '"version"' package.json | sed 's/.*"version": "\([^"]*\)".*/\1/')
          echo "PR version: $PR_VERSION"
          echo "Main version: $MAIN_VERSION"

          # No version label - skip bump
          if [ "$BUMP_TYPE" = "none" ] || [ -z "$BUMP_TYPE" ]; then
            echo "new_version=$PR_VERSION" >> $GITHUB_OUTPUT
            echo "version_bumped=false" >> $GITHUB_OUTPUT
            echo "No version label found, skipping bump"
            exit 0
          fi

          # Compare versions: if PR version > main version, version already bumped
          version_gt() {
            test "$(printf '%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" && test "$1" != "$2"
          }

          if version_gt "$PR_VERSION" "$MAIN_VERSION"; then
            echo "new_version=$PR_VERSION" >> $GITHUB_OUTPUT
            echo "version_bumped=false" >> $GITHUB_OUTPUT
            echo "PR version ($PR_VERSION) > main version ($MAIN_VERSION) - already bumped, skipping"
            exit 0
          fi

          # Validate version format
          if ! echo "$MAIN_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid main version format: $MAIN_VERSION"
            exit 1
          fi

          # Calculate new version from main branch version
          MAJOR=$(echo "$MAIN_VERSION" | cut -d. -f1)
          MINOR=$(echo "$MAIN_VERSION" | cut -d. -f2)
          PATCH=$(echo "$MAIN_VERSION" | cut -d. -f3)

          case "$BUMP_TYPE" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          # Check if PR already has the target version
          if [ "$PR_VERSION" = "$NEW_VERSION" ]; then
            echo "new_version=$PR_VERSION" >> $GITHUB_OUTPUT
            echo "version_bumped=false" >> $GITHUB_OUTPUT
            echo "PR already has target version $NEW_VERSION, skipping bump"
            exit 0
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$PR_VERSION" >> $GITHUB_OUTPUT
          echo "version_bumped=true" >> $GITHUB_OUTPUT
          echo "Version will bump: $PR_VERSION -> $NEW_VERSION ($BUMP_TYPE based on main $MAIN_VERSION)"

      - name: Setup Node.js
        if: steps.compute-version.outputs.version_bumped == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Update package.json
        if: steps.compute-version.outputs.version_bumped == 'true'
        run: |
          NEW_VERSION="${{ steps.compute-version.outputs.new_version }}"
          npm version "$NEW_VERSION" --no-git-tag-version

      - name: Commit version bump to PR
        if: steps.compute-version.outputs.version_bumped == 'true'
        run: |
          NEW_VERSION="${{ steps.compute-version.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore: bump version to $NEW_VERSION"
            git push origin ${{ github.head_ref }}
          else
            echo "package.json already has version $NEW_VERSION"
          fi

  # Job 2: Lint (parallel with type-check)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [version-bump]
    if: always() && (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Pull latest changes
        if: github.event_name == 'pull_request'
        run: git pull origin ${{ github.head_ref }} || true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # Job 3: Type Check (parallel with lint)
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [version-bump]
    if: always() && (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Pull latest changes
        if: github.event_name == 'pull_request'
        run: git pull origin ${{ github.head_ref }} || true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run type-check

  # Job 4: Test (depends on lint + type-check)
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, type-check]
    # `version-bump` is skipped on a push, and a skip propagates down the whole
    # `needs` chain: lint and type-check survive it with always(), but their own
    # success was not enough to start this job, so the suite never ran on master.
    # Gate on the parents' results instead of the implicit success().
    if: >-
      always()
      && needs.lint.result == 'success'
      && needs.type-check.result == 'success'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Pull latest changes
        if: github.event_name == 'pull_request'
        run: git pull origin ${{ github.head_ref }} || true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  # Job 5: Build (depends on test)
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    if: always() && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Pull latest changes
        if: github.event_name == 'pull_request'
        run: git pull origin ${{ github.head_ref }} || true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      # ── Fix for folio-back-end#55 (mirrored) ──────────────────────────
      # When version-bump pushes via GITHUB_TOKEN, GitHub does NOT trigger
      # new workflow runs on the resulting SHA. Branch protection requires
      # checks on HEAD, so the merge button stays blocked.
      #
      # After the build passes we resolve the real HEAD of the PR branch
      # (which may be the bot's bump commit) and post a commit status so
      # branch protection sees a green check on the latest SHA.
      - name: Forward check status to PR HEAD
        if: >-
          always()
          && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Resolve the actual HEAD SHA of the PR branch (post-bump).
          HEAD_SHA=$(git rev-parse HEAD)
          EVENT_SHA="${{ github.event.pull_request.head.sha }}"

          if [ "$HEAD_SHA" = "$EVENT_SHA" ]; then
            echo "HEAD unchanged after bump — nothing to forward."
            exit 0
          fi

          # Map job outcome to GitHub commit-status state.
          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"
          else
            STATE="failure"
          fi

          echo "Forwarding status '$STATE' to post-bump SHA $HEAD_SHA"
          gh api \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="build (forwarded from ${EVENT_SHA:0:7})" \
            -f context="build"

  # Job 6: Create release (only on push to main)
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Without this the job had no `needs` at all: it tagged, published and
    # dispatched the production deploy in the same second the checks started,
    # finishing before either of them. A red master shipped anyway.
    needs: [build]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && needs.build.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve the bump type from the merged pull request
        id: bump-type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABELS=$(gh api "repos/${{ github.repository }}/commits/$GITHUB_SHA/pulls" \
            --jq '.[].labels[].name' 2>/dev/null || echo "")
          echo "Labels on the merged PR: ${LABELS:-<none>}"

          # Explicit label wins; otherwise patch, so every merged PR releases.
          # `version:none` opts out — docs-only, ci-only, or a hotfix riding on
          # the previous release.
          if echo "$LABELS" | grep -q "version:none"; then
            TYPE=none
          elif echo "$LABELS" | grep -q "version:major"; then
            TYPE=major
          elif echo "$LABELS" | grep -q "version:minor"; then
            TYPE=minor
          else
            TYPE=patch
          fi
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "Bump type: $TYPE"

      - name: Compute the next version from the tag list
        id: get-version
        if: steps.bump-type.outputs.type != 'none'
        run: |
          # The highest released tag, not package.json. The manifest is bumped on the
          # pull request from whatever master read at that moment, so two pull requests
          # open at once claimed the same number: the second to merge landed on a tag
          # that already existed, and the release — with it the deploy dispatch — was
          # silently skipped while the run stayed green. The tag list says what has
          # actually shipped, and it is only read here, after the merge.
          BASE=$(git tag -l 'v[0-9]*' | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          BASE=${BASE:-0.0.0}

          MAJOR=${BASE%%.*}; REST=${BASE#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
          case "${{ steps.bump-type.outputs.type }}" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "Highest released tag: v$BASE -> releasing v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag
        if: steps.bump-type.outputs.type != 'none'
        run: |
          TAG="${{ steps.get-version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.bump-type.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          TAG="${{ steps.get-version.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "## What's Changed

          Version $VERSION released.

          **Full Changelog**: https://github.com/${{ github.repository }}/commits/$TAG" \
            --latest

      - name: Write job summary
        if: steps.bump-type.outputs.type != 'none'
        run: |
          echo "## Release Created" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.get-version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY

      # Notify the parent (flowitup/folio) that a new version is ready to deploy.
      # Parent listens via repository_dispatch event_type=deploy-frontend in
      # .github/workflows/deploy-frontend.yml.
      # Requires PARENT_DISPATCH_TOKEN: fine-grained PAT scoped to flowitup/folio
      # with Contents:read + Metadata:read + Actions:write.
      - name: Dispatch deploy to parent (folio)
        if: steps.bump-type.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ secrets.PARENT_DISPATCH_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.get-version.outputs.version }}"
          SHA="${{ github.sha }}"
          REF="${{ steps.get-version.outputs.tag }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Dispatching deploy-frontend to flowitup/folio (v$VERSION, sha $SHA)"
          # Build JSON via jq to guarantee string-typed payload fields and
          # safe shell-escaping. gh api exits non-zero on 4xx/5xx (set -e).
          jq -n \
            --arg version "$VERSION" \
            --arg sha     "$SHA" \
            --arg ref     "$REF" \
            --arg run_url "$RUN_URL" \
            '{event_type:"deploy-frontend", client_payload:{version:$version, sha:$sha, ref:$ref, run_url:$run_url}}' \
          | gh api -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/flowitup/folio/dispatches \
              --input -
          {
            echo "## Parent deploy dispatched"
            echo "- Event: \`deploy-frontend\`"
            echo "- Version: v$VERSION"
            echo "- SHA: \`$SHA\`"
            echo "- Parent runs: https://github.com/flowitup/folio/actions/workflows/deploy-frontend.yml"
          } >> "$GITHUB_STEP_SUMMARY"
